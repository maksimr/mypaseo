<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <!-- The theme picked in Settings, applied before the first paint; theme.ts keeps it in sync. -->
    <script>
      document.querySelector('meta[name="color-scheme"]').content = localStorage.mypaseoTheme ?? 'light dark'
    </script>
    <meta name="theme-color" content="#23252b" />
    <!-- maximum-scale: iOS zooms into focused inputs under 16px and leaves the page panned; pinch-zoom still works there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>mypaseo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
